name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The failure-report step files a temporary issue with the test log tail,
# because the repo owner reads CI failures from the API (which has no log
# download for this token). The issue is closed once the failure is fixed.
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MONGO_TEST_CONNECTION_STRING: mongodb://localhost:27017/mongodemotest?replicaSet=rs0

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Transactions and change streams need a replica set, and service
      # containers can't take a --replSet command — so MongoDB runs as a
      # plain docker container started here, then gets initiated as a
      # single-node replica set before the tests run.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})' 2>&1 | grep -qiE 'ok|already'; then
              echo "Replica set initiated."
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -qi true; then
              echo "MongoDB is PRIMARY."
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB never became PRIMARY." >&2
          docker logs mongo-rs
          exit 1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: |
          set -o pipefail
          dotnet test --no-build -c Release --verbosity normal 2>&1 | tee test-output.log

      - name: Report test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 150 test-output.log > test-failure.txt
          gh issue create \
            --title "CI test failure on ${GITHUB_SHA:0:7}" \
            --body-file test-failure.txt
